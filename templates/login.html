<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — 42 Phương Pháp Phân Tích</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
            box-shadow: var(--shadow-lg);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .login-logo__icon {
            width: 56px; height: 56px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 900; color: white;
            box-shadow: var(--shadow-glow);
        }
        .login-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }
        .login-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .form-input {
            padding: 14px 18px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: var(--font-sans);
            transition: all var(--transition-fast);
            outline: none;
        }
        .form-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-input::placeholder {
            color: var(--text-muted);
        }
        .login-btn {
            padding: 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        .login-btn:hover {
            background: var(--accent-gradient-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-error {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: var(--radius-md);
            color: #fca5a5;
            font-size: 0.9rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo__icon">PA</div>
            </div>
            <h1 class="login-title">Đăng nhập</h1>
            <p class="login-subtitle">Giáo Trình 42 Phương Pháp Phân Tích</p>

            {% if error %}
            <div class="login-error">⚠️ {{ error }}</div>
            {% endif %}

            <form class="login-form" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <input class="form-input" type="text" id="username" name="username"
                           placeholder="Nhập tên đăng nhập" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input class="form-input" type="password" id="password" name="password"
                           placeholder="Nhập mật khẩu" required>
                </div>
                <button class="login-btn" type="submit">Đăng nhập →</button>
            </form>

            <div class="login-footer">
                © 2026 Đào tạo nội bộ 📊
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
