services:
  - type: web
    name: giaotrinh-analysis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: Admin
      - key: ADMIN_PASS
        value: "2810"
      - key: PYTHON_VERSION
        value: "3.11.0"
